name: Keepalive

# GitHub turns off scheduled workflows in a public repo after 60 days without commits. This adds an
# empty commit once a month so the daily pipeline keeps running through quiet stretches.

on:
  schedule:
    - cron: "11 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: keep scheduled workflows enabled"
          git push
